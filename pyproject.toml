[project]
name = "lead-qualifier"
version = "0.1.0"
description = "AI agent that qualifies inbound leads against your Ideal Customer Profile and routes them to Slack, webhooks and your CRM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quantum Dev" }]
requires-python = ">=3.11"
keywords = ["lead-qualification", "sales", "llm", "ai-agent", "fastapi", "hubspot", "pipedrive", "crm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Quantum-dev1/lead-qualifier"
Issues = "https://github.com/Quantum-dev1/lead-qualifier/issues"

[project.scripts]
lead-qualifier = "lead_qualifier.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_qualifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # Starlette's TestClient nudges towards a newer HTTP client; irrelevant for these tests.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
# E501: long regexes and test strings are left to the formatter's judgement.
ignore = ["E501", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
