services:
  lead-qualifier:
    build: .
    image: lead-qualifier:local
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./config:/app/config:ro      # edit the ICP without rebuilding
      - lead-data:/app/data          # SQLite decision log
    restart: unless-stopped

volumes:
  lead-data:
